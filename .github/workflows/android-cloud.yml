name: Android Cloud

on:
  workflow_dispatch:

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM ready"

      - name: Install Tailscale and Connect
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=android-$GITHUB_RUN_ID
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
          echo "Tailscale IP: $IP"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget unzip xvfb fluxbox ffmpeg scrcpy nodejs npm 2>/dev/null || true
          echo "Dependencies installed"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" > /dev/null 2>&1
          echo "Android SDK installed"

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $HOME/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_4 --force
          AVD_DIR=$HOME/.android/avd/android-cloud.avd
          mkdir -p "$AVD_DIR"
          AVD_CFG="$AVD_DIR/config.ini"
          echo "hw.ramSize=3072"                   >> "$AVD_CFG"
          echo "hw.cpu.ncore=2"                    >> "$AVD_CFG"
          echo "hw.gpu.enabled=yes"                >> "$AVD_CFG"
          echo "hw.gpu.mode=swiftshader_indirect"  >> "$AVD_CFG"
          echo "vm.heapSize=512"                   >> "$AVD_CFG"
          echo "hw.keyboard=yes"                   >> "$AVD_CFG"
          echo "AVD created"

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac &
          sleep 2
          export DISPLAY=:99
          fluxbox &
          sleep 1
          export ANDROID_HOME=$HOME/android-sdk
          nohup $ANDROID_HOME/emulator/emulator \
            -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 3072 -cores 2 \
            -display :99 > /tmp/emu.log 2>&1 &
          echo "Waiting for emulator to boot..."
          for i in $(seq 1 72); do
            BOOT=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")
            if [ "$BOOT" = "1" ]; then
              echo "Emulator booted after $((i*5))s"
              break
            fi
            sleep 5
          done
          $ANDROID_HOME/platform-tools/adb shell input keyevent KEYCODE_WAKEUP || true

      - name: Enable ADB over TCP
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          $ANDROID_HOME/platform-tools/adb tcpip 5555
          sleep 2
          echo "ADB TCP enabled"

      - name: Setup WebSocket Stream Server
        run: |
          cd .github/stream-server
          npm init -y > /dev/null 2>&1
          npm install ws > /dev/null 2>&1
          wget -q "https://cdn.jsdelivr.net/gh/phoboslab/jsmpeg@master/jsmpeg.min.js" -O jsmpeg.min.js 2>/dev/null || true
          export DISPLAY=:99
          node server.js &
          sleep 3
          echo "Stream server started"

      - name: Show Connection Info
        run: |
          echo "=========================================================="
          echo "  Android 14 Cloud Ready!"
          echo "=========================================================="
          echo ""
          echo "  FASTEST - scrcpy مباشر (H.264 ~20ms):"
          echo "  ----------------------------------------"
          echo "  scrcpy --tcpip=$TAILSCALE_IP:5555"
          echo ""
          echo "  BROWSER - WebSocket/MPEG1 (~80ms):"
          echo "  ----------------------------------------"
          echo "  http://$TAILSCALE_IP:8080"
          echo ""
          echo "  ADB مباشر:"
          echo "  adb connect $TAILSCALE_IP:5555"
          echo "=========================================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] Android Cloud active | http://$TAILSCALE_IP:8080 | scrcpy --tcpip=$TAILSCALE_IP:5555"
            sleep 300
          done
