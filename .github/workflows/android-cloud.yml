name: Android Cloud

on:
  workflow_dispatch:

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install Tailscale and Connect
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=android-$GITHUB_RUN_ID
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $IP"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jdk wget unzip \
            xvfb fluxbox \
            x11vnc xdotool wmctrl \
            libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 libxrandr2 libxss1 \
            nodejs npm
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null 2>&1

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis_playstore;x86_64" \
            -d pixel_4 --force
          AVD_DIR=$(find "$HOME/.android" -maxdepth 4 -type d -name "android-cloud.avd" 2>/dev/null | head -1)
          [ -z "$AVD_DIR" ] && AVD_DIR="$ANDROID_AVD_HOME/android-cloud.avd" && mkdir -p "$AVD_DIR"
          printf '%s\n' \
            'hw.ramSize=6144' \
            'hw.cpu.ncore=2' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'vm.heapSize=1024' \
            'hw.keyboard=yes' \
            'hw.lcd.width=1080' \
            'hw.lcd.height=1920' \
            'hw.lcd.density=420' \
            'disk.dataPartition.size=16G' \
            'net.shared_nets=*' \
            >> "$AVD_DIR/config.ini"

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        run: |
          export DISPLAY=:99
          export ANDROID_HOME=$HOME/android-sdk
          Xvfb :99 -screen 0 1440x2960x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox > /tmp/fluxbox.log 2>&1 &
          adb start-server
          emulator -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 6144 -cores 2 -accel on \
            -netdelay none -netspeed full \
            > /tmp/emu.log 2>&1 &
          EMULATOR_PID=$!
          echo "Waiting for ADB..."
          for i in $(seq 1 90); do
            ! kill -0 "$EMULATOR_PID" 2>/dev/null && echo "Emulator crashed" && cat /tmp/emu.log && exit 1
            adb devices | awk 'NR>1 && $2=="device"{found=1} END{exit(found?0:1)}' && echo "ADB ready after $((i*2))s" && break
            sleep 2
          done
          echo "Waiting for boot..."
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BOOT" = "1" ] && echo "Booted after $((i*2))s" && break
            sleep 2
          done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm size 1080x1920 || true

      - name: Configure Internet + DNS
        run: |
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb shell setprop net.dns1 1.1.1.1 || true
          adb shell setprop net.dns2 8.8.8.8 || true
          adb shell setprop net.dns3 8.8.4.4 || true
          adb tcpip 5555
          echo "Internet configured with fast DNS"

      - name: Install Brave Browser
        run: |
          echo "Downloading Brave Browser..."
          BRAVE_VER=$(curl -s https://api.github.com/repos/brave/brave-browser/releases/latest | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)
          echo "Brave version: $BRAVE_VER"
          wget -q "https://github.com/brave/brave-browser/releases/download/${BRAVE_VER}/BraveMonox86_64.apk" -O /tmp/brave.apk 2>/dev/null || \
          wget -q "https://github.com/brave/brave-browser/releases/download/${BRAVE_VER}/Brave-Browser-x86_64.apk" -O /tmp/brave.apk 2>/dev/null || true
          if [ -s /tmp/brave.apk ]; then
            adb install -r /tmp/brave.apk && echo "Brave installed!" || echo "Brave install failed"
          else
            echo "Brave APK not found for this version, skipping"
          fi

      - name: Install 8 Ball Pool
        run: |
          echo "Downloading 8 Ball Pool..."
          wget -q --user-agent "Mozilla/5.0 (Linux; Android 14)" \
            "https://d.apkpure.com/b/APK/com.miniclip.eightballpool?version=latest" \
            -O /tmp/8ball.apk 2>/dev/null || true
          if [ -s /tmp/8ball.apk ] && [ $(wc -c < /tmp/8ball.apk) -gt 1000000 ]; then
            adb install -r /tmp/8ball.apk && echo "8 Ball Pool installed!" || echo "8 Ball Pool install failed (ARM-only APK)"
          else
            echo "Trying alternate source..."
            wget -q --user-agent "Mozilla/5.0 (Linux; Android 14)" \
              "https://apkpure.com/8-ball-pool/com.miniclip.eightballpool/download" \
              -O /tmp/8ball2.apk 2>/dev/null || true
            adb install -r /tmp/8ball2.apk 2>/dev/null && echo "8 Ball Pool installed!" || echo "8 Ball Pool skipped"
          fi

      - name: Setup VNC + noVNC Browser
        run: |
          export DISPLAY=:99
          sleep 2
          EMU_WIN=$(xdotool search --name "Android Emulator" 2>/dev/null | head -1 || true)
          [ -n "$EMU_WIN" ] && wmctrl -ir "$EMU_WIN" -b add,maximized_vert,maximized_horz || true
          mkdir -p ~/.vnc
          x11vnc -storepasswd android1234 ~/.vnc/passwd
          x11vnc -display :99 -rfbauth ~/.vnc/passwd -rfbport 5900 -forever -shared -bg -quiet -noxdamage
          sleep 2
          nohup /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 2

      - name: Start Telegram AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nohup node .github/scripts/tg-bot.js > /tmp/tg-bot.log 2>&1 &
          sleep 3
          if pgrep -f "tg-bot.js" > /dev/null; then
            echo "Telegram bot is running"
          else
            echo "Bot failed:"
            cat /tmp/tg-bot.log
          fi

      - name: Show Connection Info
        run: |
          echo "========================================================"
          echo "  Android 14 Cloud Ready - 6GB RAM"
          echo "========================================================"
          echo "  VNC Viewer : $TAILSCALE_IP:5900  |  Password: android1234"
          echo "  Browser    : http://$TAILSCALE_IP:6080/vnc.html"
          echo "  ADB        : adb connect $TAILSCALE_IP:5555"
          echo "========================================================"

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] active | VNC: $TAILSCALE_IP:5900"
            if ! pgrep -f "tg-bot.js" > /dev/null; then
              echo "Bot crashed, restarting..."
              TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              nohup node .github/scripts/tg-bot.js >> /tmp/tg-bot.log 2>&1 &
            fi
            sleep 60
          done
