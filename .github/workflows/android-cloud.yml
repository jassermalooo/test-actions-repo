name: Android Cloud

on:
  workflow_dispatch:
    inputs:
      camera_video_url:
        description: 'رابط فيديو للكاميرا الافتراضية (اختياري)'
        required: false
        default: ''

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install Tailscale and Connect
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=android-$GITHUB_RUN_ID
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $IP"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jdk wget unzip \
            xvfb fluxbox \
            x11vnc xdotool wmctrl \
            scrcpy ffmpeg \
            v4l2loopback-dkms v4l-utils \
            nodejs npm
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Setup Virtual Camera
        run: |
          sudo modprobe v4l2loopback devices=1 video_nr=0 card_label="VirtualCamera" exclusive_caps=1 || true
          sleep 2
          VIDEO_URL="${{ github.event.inputs.camera_video_url }}"
          if [ -n "$VIDEO_URL" ]; then
            wget -q -O /tmp/camera_input.mp4 "$VIDEO_URL"
            nohup ffmpeg -re -stream_loop -1 -i /tmp/camera_input.mp4 -vf "scale=1280:720,fps=30" -f v4l2 /dev/video0 > /tmp/ffmpeg_cam.log 2>&1 &
          else
            nohup ffmpeg -re -f lavfi -i "testsrc=size=1280x720:rate=30" -f v4l2 /dev/video0 > /tmp/ffmpeg_cam.log 2>&1 &
          fi
          sleep 2

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null 2>&1

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis_playstore;x86_64" \
            -d pixel_4 --force
          AVD_DIR=$(find "$HOME/.android" -maxdepth 4 -type d -name "android-cloud.avd" 2>/dev/null | head -1)
          [ -z "$AVD_DIR" ] && AVD_DIR="$ANDROID_AVD_HOME/android-cloud.avd" && mkdir -p "$AVD_DIR"
          printf '%s\n' \
            'hw.ramSize=4096' 'hw.cpu.ncore=2' \
            'hw.gpu.enabled=yes' 'hw.gpu.mode=swiftshader_indirect' \
            'vm.heapSize=1024' 'hw.keyboard=yes' \
            'hw.lcd.width=1080' 'hw.lcd.height=1920' 'hw.lcd.density=420' \
            'hw.camera.back=webcam0' 'hw.camera.front=emulated' \
            >> "$AVD_DIR/config.ini"

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        run: |
          export DISPLAY=:99
          export ANDROID_HOME=$HOME/android-sdk
          Xvfb :99 -screen 0 1440x2960x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox > /tmp/fluxbox.log 2>&1 &
          adb start-server
          emulator -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 4096 -cores 2 -accel on \
            -netdelay none -netspeed full \
            -camera-back webcam0 -camera-front emulated \
            > /tmp/emu.log 2>&1 &
          EMULATOR_PID=$!
          echo "Waiting for ADB..."
          for i in $(seq 1 90); do
            ! kill -0 "$EMULATOR_PID" 2>/dev/null && echo "Emulator crashed" && cat /tmp/emu.log && exit 1
            adb devices | awk 'NR>1 && $2=="device"{found=1} END{exit(found?0:1)}' && echo "ADB ready after $((i*2))s" && break
            sleep 2
          done
          echo "Waiting for boot..."
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BOOT" = "1" ] && echo "Booted after $((i*2))s" && break
            sleep 2
          done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm size 1080x1920 || true

      - name: Enable ADB over TCP
        run: |
          adb tcpip 5555
          sleep 2

      - name: Setup VNC
        run: |
          export DISPLAY=:99
          sleep 3
          EMU_WIN=$(xdotool search --name "Android Emulator" 2>/dev/null | head -1 || true)
          [ -n "$EMU_WIN" ] && wmctrl -ir "$EMU_WIN" -b add,maximized_vert,maximized_horz || true
          mkdir -p ~/.vnc
          x11vnc -storepasswd android1234 ~/.vnc/passwd
          x11vnc -display :99 -rfbauth ~/.vnc/passwd -rfbport 5900 -forever -shared -bg -quiet -noxdamage
          sleep 2
          nohup /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 2

      - name: Start Telegram AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          nohup node .github/scripts/tg-bot.js > /tmp/tg-bot.log 2>&1 &
          sleep 3
          # تأكد أن البوت شغّال
          if pgrep -f "tg-bot.js" > /dev/null; then
            echo "✅ Telegram bot is running"
          else
            echo "❌ Bot failed to start, logs:"
            cat /tmp/tg-bot.log
          fi

      - name: Show Connection Info
        run: |
          echo "============================================================"
          echo "  Android 14 Cloud Ready!"
          echo "============================================================"
          echo "  VNC Viewer : $TAILSCALE_IP:5900  |  Password: android1234"
          echo "  Browser    : http://$TAILSCALE_IP:6080/vnc.html"
          echo "  Telegram   : بوت التحكم شغّال - أرسل /start"
          echo "  ADB        : adb connect $TAILSCALE_IP:5555"
          echo "============================================================"

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] active | VNC: $TAILSCALE_IP:5900 | Bot: running"
            # إعادة تشغيل البوت إذا تعطّل
            if ! pgrep -f "tg-bot.js" > /dev/null; then
              echo "Bot crashed, restarting..."
              TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              nohup node .github/scripts/tg-bot.js >> /tmp/tg-bot.log 2>&1 &
            fi
            sleep 60
          done
