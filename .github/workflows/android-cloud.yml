name: Android Cloud

on:
  workflow_dispatch:

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          echo "KVM ready"

      - name: Install Tailscale and Connect
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=android-$GITHUB_RUN_ID
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $IP"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jdk wget unzip \
            xvfb fluxbox \
            x11vnc xdotool wmctrl \
            scrcpy \
            nodejs npm
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          echo "Dependencies installed"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" > /dev/null 2>&1
          echo "Android SDK installed"

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_4 --force

          # Locate config.ini dynamically
          AVD_DIR=$(find "$HOME/.android" -maxdepth 4 -type d -name "android-cloud.avd" 2>/dev/null | head -1)
          if [ -z "$AVD_DIR" ]; then
            AVD_DIR="$ANDROID_AVD_HOME/android-cloud.avd"
            mkdir -p "$AVD_DIR"
          fi

          touch "$AVD_DIR/config.ini"
          printf '%s\n' \
            'hw.ramSize=4096' \
            'hw.cpu.ncore=2' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'vm.heapSize=1024' \
            'hw.keyboard=yes' \
            'hw.lcd.width=1080' \
            'hw.lcd.height=1920' \
            'hw.lcd.density=420' \
            >> "$AVD_DIR/config.ini"

          echo "AVD created: $AVD_DIR"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export ANDROID_HOME=$HOME/android-sdk

          # Start virtual display — wide enough to fit emulator + controls
          Xvfb :99 -screen 0 1440x2960x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox > /tmp/fluxbox.log 2>&1 &

          # Start emulator
          adb start-server
          emulator -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 4096 -cores 2 \
            -accel on \
            -netdelay none -netspeed full \
            > /tmp/emu.log 2>&1 &
          EMULATOR_PID=$!

          echo "Waiting for ADB device..."
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator crashed"; cat /tmp/emu.log; exit 1
            fi
            if adb devices | awk 'NR>1 && $2=="device"{found=1} END{exit(found?0:1)}'; then
              echo "ADB device ready after $((i*2))s"; break
            fi
            sleep 2
          done

          echo "Waiting for Android boot..."
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then echo "Booted after $((i*2))s"; break; fi
            sleep 2
          done

          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm size 1080x1920 || true

      - name: Enable ADB over TCP
        run: |
          adb tcpip 5555
          sleep 2
          echo "ADB TCP enabled on port 5555"

      - name: Setup noVNC (Browser VNC)
        run: |
          export DISPLAY=:99

          # Maximize and remove decorations from the emulator window
          sleep 3
          EMU_WIN=$(xdotool search --name "Android Emulator" 2>/dev/null | head -1 || true)
          if [ -n "$EMU_WIN" ]; then
            wmctrl -ir "$EMU_WIN" -b add,maximized_vert,maximized_horz || true
            xdotool windowfocus "$EMU_WIN" || true
            echo "Emulator window maximized"
          fi

          # Start x11vnc — captures the X display (where emulator window lives)
          x11vnc -display :99 -nopw -forever -shared \
            -rfbport 5900 -bg -quiet -noxdamage
          sleep 2

          # Start noVNC websockify on port 6080
          nohup /tmp/novnc/utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 \
            > /tmp/novnc.log 2>&1 &
          sleep 3

          echo "VNC port 5900 ready"
          echo "noVNC browser client port 6080 ready"

      - name: Show Connection Info
        run: |
          echo "============================================================"
          echo "  Android 14 Cloud Ready!"
          echo "============================================================"
          echo ""
          echo "  BROWSER (موبايل/كمبيوتر) — تحكم كامل بالضغط واللمس:"
          echo "  http://$TAILSCALE_IP:6080/vnc.html"
          echo ""
          echo "  scrcpy — أسرع (كمبيوتر فقط):"
          echo "  scrcpy --tcpip=$TAILSCALE_IP:5555"
          echo ""
          echo "  ADB مباشر:"
          echo "  adb connect $TAILSCALE_IP:5555"
          echo "============================================================"

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] Android Cloud active"
            echo "  noVNC: http://$TAILSCALE_IP:6080/vnc.html"
            echo "  scrcpy: scrcpy --tcpip=$TAILSCALE_IP:5555"
            sleep 300
          done
