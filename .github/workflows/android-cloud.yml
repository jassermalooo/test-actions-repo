name: Android Cloud

on:
  workflow_dispatch:

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jdk wget unzip \
            xvfb fluxbox \
            x11vnc xdotool wmctrl \
            nodejs npm
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis_playstore;x86_64" > /dev/null 2>&1

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis_playstore;x86_64" \
            -d pixel_4 --force
          AVD_DIR=$(find "$HOME/.android" -maxdepth 4 -type d -name "android-cloud.avd" 2>/dev/null | head -1)
          [ -z "$AVD_DIR" ] && AVD_DIR="$ANDROID_AVD_HOME/android-cloud.avd" && mkdir -p "$AVD_DIR"
          printf '%s\n' \
            'hw.ramSize=2048' 'hw.cpu.ncore=2' \
            'hw.gpu.enabled=yes' 'hw.gpu.mode=swiftshader_indirect' \
            'vm.heapSize=512' 'hw.keyboard=yes' \
            'hw.lcd.width=1080' 'hw.lcd.height=1920' 'hw.lcd.density=420' \
            'disk.dataPartition.size=8G' \
            >> "$AVD_DIR/config.ini"

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        run: |
          export DISPLAY=:99
          export ANDROID_HOME=$HOME/android-sdk
          Xvfb :99 -screen 0 1440x2960x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          fluxbox > /tmp/fluxbox.log 2>&1 &
          adb start-server
          emulator -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 2048 -cores 2 -accel on \
            -netdelay none -netspeed full \
            > /tmp/emu.log 2>&1 &
          EMULATOR_PID=$!
          echo "Waiting for ADB..."
          for i in $(seq 1 90); do
            ! kill -0 "$EMULATOR_PID" 2>/dev/null && echo "Emulator crashed" && cat /tmp/emu.log && exit 1
            adb devices | awk 'NR>1 && $2=="device"{found=1} END{exit(found?0:1)}' && echo "ADB ready after $((i*2))s" && break
            sleep 2
          done
          echo "Waiting for boot..."
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BOOT" = "1" ] && echo "Booted after $((i*2))s" && break
            sleep 2
          done
          adb shell input keyevent KEYCODE_WAKEUP

      - name: Setup VNC + noVNC Browser
        run: |
          export DISPLAY=:99
          sleep 2
          EMU_WIN=$(xdotool search --name "Android Emulator" 2>/dev/null | head -1 || true)
          [ -n "$EMU_WIN" ] && wmctrl -ir "$EMU_WIN" -b add,maximized_vert,maximized_horz || true
          mkdir -p ~/.vnc
          x11vnc -storepasswd android1234 ~/.vnc/passwd
          x11vnc -display :99 -rfbauth ~/.vnc/passwd -rfbport 5900 -forever -shared -bg -quiet -noxdamage
          sleep 2
          nohup /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Create Public Browser URL (Cloudflare Tunnel)
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --url http://localhost:6080 > /tmp/tunnel.log 2>&1 &
          sleep 12
          BROWSER_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          echo "BROWSER_URL=$BROWSER_URL" >> "$GITHUB_ENV"
          echo "Browser URL: $BROWSER_URL"
          MSG="Android Cloud Ready! Browser: ${BROWSER_URL}/vnc.html | Password: android1234"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"5653032481\",\"text\":\"${MSG}\"}" || true

      - name: Install Ollama + AI Vision Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 8
          echo "Pulling llava-phi3 (no API key needed)..."
          ollama pull llava-phi3
          echo "AI model ready:"
          ollama list

      - name: Start Telegram AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          nohup node .github/scripts/tg-bot.js > /tmp/tg-bot.log 2>&1 &
          sleep 3
          if pgrep -f "tg-bot.js" > /dev/null; then
            echo "Telegram bot is running"
          else
            echo "Bot failed to start:"
            cat /tmp/tg-bot.log
          fi

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] active"
            if ! pgrep -f "tg-bot.js" > /dev/null; then
              echo "Bot crashed, restarting..."
              TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              nohup node .github/scripts/tg-bot.js >> /tmp/tg-bot.log 2>&1 &
            fi
            sleep 60
          done
