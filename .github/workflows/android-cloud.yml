name: Android Cloud

on:
  workflow_dispatch:

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          echo "KVM ready"

      - name: Install Tailscale and Connect
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=android-$GITHUB_RUN_ID
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $IP"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget unzip xvfb fluxbox ffmpeg scrcpy nodejs npm
          echo "Dependencies installed"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" > /dev/null 2>&1
          echo "Android SDK installed"

      - name: Create Android Virtual Device
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$HOME/.android/avd"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n android-cloud \
            -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_4 --force
          AVD_DIR="$HOME/.android/avd/android-cloud.avd"
          AVD_CFG="$AVD_DIR/config.ini"
          cat >> "$AVD_CFG" <<'AVD_CONFIG'
          hw.ramSize=3072
          hw.cpu.ncore=2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          vm.heapSize=512
          hw.keyboard=yes
          AVD_CONFIG
          echo "AVD created"

      - name: Checkout repo files
        uses: actions/checkout@v4

      - name: Start Virtual Display and Emulator
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export ANDROID_HOME=$HOME/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          fluxbox > /tmp/fluxbox.log 2>&1 &

          adb start-server
          emulator -avd android-cloud \
            -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 3072 -cores 2 \
            > /tmp/emu.log 2>&1 &
          EMULATOR_PID=$!

          echo "Waiting for emulator device..."
          device_ready=false
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited before ADB became ready"
              cat /tmp/emu.log
              exit 1
            fi
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit(found ? 0 : 1) }'; then
              device_ready=true
              echo "ADB device detected after $((i * 2))s"
              break
            fi
            sleep 2
          done

          if [ "$device_ready" != true ]; then
            echo "Timed out waiting for an ADB device"
            cat /tmp/emu.log
            adb devices || true
            exit 1
          fi

          echo "Waiting for Android to finish booting..."
          boot_completed=false
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then
              boot_completed=true
              echo "Emulator booted after $((i * 2))s"
              break
            fi
            sleep 2
          done

          if [ "$boot_completed" != true ]; then
            echo "Timed out waiting for Android boot"
            cat /tmp/emu.log
            adb shell getprop ro.build.version.release || true
            exit 1
          fi

          adb shell input keyevent KEYCODE_WAKEUP

      - name: Enable ADB over TCP
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          adb tcpip 5555
          sleep 2
          echo "ADB TCP enabled"

      - name: Setup WebSocket Stream Server
        run: |
          cd .github/stream-server
          npm init -y > /dev/null 2>&1
          npm install ws > /dev/null 2>&1
          wget -q "https://cdn.jsdelivr.net/gh/phoboslab/jsmpeg@master/jsmpeg.min.js" -O jsmpeg.min.js
          export DISPLAY=:99
          nohup node server.js > /tmp/stream-server.log 2>&1 &
          sleep 3
          echo "Stream server started"

      - name: Show Connection Info
        run: |
          echo "=========================================================="
          echo "  Android 14 Cloud Ready!"
          echo "=========================================================="
          echo ""
          echo "  FASTEST - scrcpy مباشر (H.264 ~20ms):"
          echo "  ----------------------------------------"
          echo "  scrcpy --tcpip=$TAILSCALE_IP:5555"
          echo ""
          echo "  BROWSER - WebSocket/MPEG1 (~80ms):"
          echo "  ----------------------------------------"
          echo "  http://$TAILSCALE_IP:8080"
          echo ""
          echo "  ADB مباشر:"
          echo "  adb connect $TAILSCALE_IP:5555"
          echo "=========================================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "[$(date +%T)] Android Cloud active | http://$TAILSCALE_IP:8080 | scrcpy --tcpip=$TAILSCALE_IP:5555"
            sleep 300
          done
