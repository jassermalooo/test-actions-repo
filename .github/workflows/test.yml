name: Test GitHub Actions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hello World
        run: |
          echo "✅ GitHub Actions يعمل بنجاح!"
          echo "التاريخ: $(date)"
          echo "المستخدم: ${{ github.actor }}"
          echo "المستودع: ${{ github.repository }}"

      - name: فحص البيئة
        run: |
          echo "نظام التشغيل: $(uname -a)"
          echo "Node.js: $(node --version)"
          echo "Python: $(python3 --version)"

      - name: اختبار ناجح
        run: echo "🎉 كل شيء يعمل!"
