name: Windows RDP New

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Rule" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Rule" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Admin Privileges
        shell: powershell
        run: |
          $cfgPath = "$env:TEMP\secpol.cfg"
          $dbPath  = "$env:TEMP\secedit.sdb"
          secedit /export /cfg $cfgPath
          $content = Get-Content $cfgPath -Encoding Unicode
          $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $content | Set-Content $cfgPath -Encoding Unicode
          secedit /configure /db $dbPath /cfg $cfgPath /areas SECURITYPOLICY /quiet
          gpupdate /force | Out-Null
          net user RDP 12345 /add
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ConsentPromptBehaviorAdmin' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'PromptOnSecureDesktop' -Value 0 -Force
          Write-Host "User: RDP | Password: 12345 | Admin: Full (UAC disabled)"

      - name: Install Latest Kali Linux WSL and Desktop Shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Install the current Kali rolling distribution from the official WSL source.
          wsl.exe --update --web-download
          if ((wsl.exe --list --quiet 2>$null) -notcontains "kali-linux") {
            wsl.exe --install --distribution kali-linux --no-launch
          }
          wsl.exe --set-default-version 2
          $distro = (wsl.exe --list --quiet 2>$null | Where-Object { $_.Trim() -eq "kali-linux" } | Select-Object -First 1)
          if (-not $distro) {
            Write-Error "Kali Linux was not installed"
            exit 1
          }
          $desktop = [Environment]::GetFolderPath("Desktop")
          $shortcutPath = Join-Path $desktop "Kali Linux.lnk"
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = "$env:SystemRoot\System32\wsl.exe"
          $shortcut.Arguments = "-d kali-linux"
          $shortcut.WorkingDirectory = $desktop
          $shortcut.IconLocation = "$env:SystemRoot\System32\wsl.exe,0"
          $shortcut.Save()
          Write-Host "Kali Linux installed and shortcut created at $shortcutPath"

      - name: Install Kali Linux Windows App and Desktop Shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Official Kali Linux application from the Microsoft Store via winget.
          winget install --exact --id kalilinux.kalilinux --accept-source-agreements --accept-package-agreements --silent
          Start-Sleep -Seconds 5
          $app = Get-StartApps | Where-Object { $_.Name -eq "Kali Linux" } | Select-Object -First 1
          if (-not $app) {
            Write-Error "Kali Linux Windows application was not found after installation"
            exit 1
          }
          $desktop = [Environment]::GetFolderPath("Desktop")
          $shortcutPath = Join-Path $desktop "Kali Linux App.lnk"
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = "$env:SystemRoot\explorer.exe"
          $shortcut.Arguments = "shell:AppsFolder\$($app.AppID)"
          $shortcut.WorkingDirectory = $desktop
          $shortcut.Save()
          Write-Host "Kali Linux app installed: $($app.AppID)"
          Write-Host "Desktop shortcut created at $shortcutPath"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $p = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $url -OutFile $p -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$p`"","/quiet","/norestart" -Wait
          Remove-Item $p -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-new-$env:GITHUB_RUN_ID
          $ip = $null
          for ($i = 0; $i -lt 15; $i++) {
            $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null) | Select-Object -First 1
            if ($ip) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $ip) { Write-Error 'Tailscale IP not assigned'; exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      - name: Print Connection Info
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "RDP Ready!"
          Write-Host "IP  : $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "User: RDP"
          Write-Host "Pass: 12345"
          Write-Host "Admin: Full (no UAC prompts)"
          Write-Host "================================"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active | IP: $env:TAILSCALE_IP"
            Start-Sleep -Seconds 60
          }
